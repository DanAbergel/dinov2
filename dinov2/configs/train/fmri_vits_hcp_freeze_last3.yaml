# HCP-only T=1200 ablation: freeze=fmri_plus_last_3.
# Train the fMRI-adapter (patch_embed.*) PLUS the last 3 transformer blocks
# (blocks.9, .10, .11) PLUS the final LayerNorm. Blocks 0..8, cls_token,
# register_tokens, pos_embed stay frozen at their ImageNet init. Tests
# whether unfreezing only the late layers is enough to adapt ImageNet
# representations to fMRI.
#
# Compares against:
#   - Baseline (no freeze)         : outputs/dinov2_fmri_20260524_144327 (already trained)
#   - Other freeze (fmri only)     : fmri_vits_hcp_freeze_fmri.yaml

train:
  dataset_path: HCP
  batch_size_per_gpu: 2
  num_workers: 4
  cache_dataset: false
  OFFICIAL_EPOCH_LENGTH: 1000
  centering: "sinkhorn_knopp"
  cell_augmentation: false
  fmri_augmentation: true
  seed: 42

student:
  arch: vit_small
  patch_size: 9
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  drop_path_uniform: true
  ffn_layer: "mlp"
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 4
  interpolate_antialias: false
  interpolate_offset: 0.1
  in_chans: 1
  channel_adaptive: false
  pretrained_weights: "/sci/labs/arieljaffe/dan.abergel1/checkpoints/dinov2_vits14_reg4_fmri_init.pth"
  fmri_mode: true
  fmri_img_size: [45, 54, 45]
  fmri_temporal_size: 1200
  fmri_temporal_kernel: 20

teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.04
  teacher_temp: 0.07
  warmup_teacher_temp_epochs: 5
  in_chans: 1
  channel_adaptive: false

optim:
  freeze_pretrained: "fmri_plus_last_3"   # <-- THE ABLATION KNOB
  grad_accum_steps: 8
  epochs: 20
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 3.0e-4
  warmup_epochs: 1
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 1.0
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  global_crops_scale: [0.32, 1.0]
  local_crops_number: 8
  local_crops_scale: [0.05, 0.32]
  global_crops_size: 224
  local_crops_size: 96

dino:
  loss_weight: 1.0
  head_n_prototypes: 4096
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0.1

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max: [0.1, 0.5]
  separate_head: false
  head_n_prototypes: 4096
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048

evaluation:
  eval_period_iterations: 0
