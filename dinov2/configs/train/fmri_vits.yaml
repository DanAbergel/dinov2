# fMRI SSL config. Inherits from ssl_default_config.yaml (merged by
# dinov2.utils.config.setup) — every field below overrides a default
# rather than redefining the schema, so the official `do_train`,
# `SSLMetaArch.__init__` and `build_model_from_cfg` see a config that
# is structurally identical to the ImageNet one and only differs on the
# values that genuinely need to change for fMRI.

train:
  dataset_path: "Mixed:t_fixed=90"    # HCP-only (via quota). T_fixed=90 (65s @ 0.72s) instead of 270: ~3x less
                                      # conv memory, ~9x less attention -> batch 8/16 fits; also drops fewer short scans.
  batch_size_per_gpu: 8               # REAL batch (grad_accum=1) so centering/Sinkhorn see the whole batch, not 2.
                                      # Default 8: safe with 4 FULL-volume locals on one h200. Test 1 can try
                                      # BATCH_PER_GPU=16 (tighter); Test 2 (light temporal-zoom locals) fits 16 easily.
                                      # Must divide the quota block (32): 4/8/16/32.
  num_workers: 4                      # data loading bottleneck; cap at 4 to fit cgroup RAM
  cache_dataset: false
  OFFICIAL_EPOCH_LENGTH: 2300         # ~ one pass over 4627 scans at micro-batch 2 (4627/2); drives the LR schedule
  centering: "sinkhorn_knopp"
  cell_augmentation: false
  fmri_augmentation: true             # fMRI token grid (T_eff, N_spatial) + fMRI augmentation branch
  fmri_masking_only: true             # full-image crops + per-token random masking (meeting 2026-06-14 §2)
  proportional_sampler: true          # per-batch dataset quota (block sums to the effective batch = 16)
  proportional_quota: {HCP: 32}       # HCP-ONLY (Ariel 2026-08). Block=32 so a REAL batch up to 32 fits in one
                                      # forward (BATCH_PER_GPU=32 GRAD_ACCUM=1) -> centering/Sinkhorn see the FULL
                                      # batch, not a 2-sample micro-batch (grad-accum doesn't feed centering).
  seed: 42

student:
  arch: vit_small
  patch_size: 9                       # spatial Conv3d kernel/stride
  drop_path_rate: 0.1
  layerscale: 1.0e-05
  drop_path_uniform: true
  ffn_layer: "mlp"
  block_chunks: 0
  qkv_bias: true
  proj_bias: true
  ffn_bias: true
  num_register_tokens: 4
  interpolate_antialias: false
  interpolate_offset: 0.1
  in_chans: 1
  channel_adaptive: false
  # Filtered DINOv2 ViT-S/14 reg4 ImageNet checkpoint (pos_embed +
  # patch_embed.* removed because their shapes don't match the fMRI
  # 3D+1D embedding / token grid). Prepared by jobs/run_dinov2_fmri.sh
  # before the run. Set to '' to train from random init.
  pretrained_weights: "/sci/labs/arieljaffe/dan.abergel1/checkpoints/dinov2_vits14_reg4_fmri_init.pth"  # DINOv2 init (run tasks/data_prep/prepare_dinov2_init first)
  # ----- fMRI-specific fields (consumed by build_model_from_cfg) -----
  fmri_mode: true
  fmri_img_size: [45, 54, 45]         # HCP downsampled volume; patch=9 -> 5*6*5 = 150 spatial tokens
  fmri_temporal_size: 90              # T_fixed window (= 64.8 s @ TR 0.72 s). MUST match dataset t_fixed above.
  fmri_temporal_kernel: 10            # T_eff = 90 / 10 = 9 temporal tokens per crop (pools 2 then 5: 90->45->9)
  # Token grid: T_eff * N_spatial = 27 * 150 = 4050 tokens.
  # Factorised (learned) pos params: (27 + 150 + 1) * 384 = 68 352.
  # Downsampling is always AvgPool on stride-1 convs (spatial and temporal).

teacher:
  momentum_teacher: 0.992
  final_momentum_teacher: 1.0
  warmup_teacher_temp: 0.01           # SHARP start (small-corpus recipe): the 2D work proved the ImageNet-soft
  teacher_temp: 0.04                  # 0.04->0.07 pins the loss at the indecisive floor -> no learning.
  warmup_teacher_temp_epochs: 5       # sharp-then-soft 0.01->0.04 over half of training was the 2D winner (+30 pts on Imagenette).
  in_chans: 1
  channel_adaptive: false

optim:
  freeze_pretrained: "fmri_plus_last_3"  # B: freeze DINOv2 blocks 0-8; train patch_embed + blocks 9-11 + norm + heads. ('none'=A full-FT, 'fmri_only'=C)
  grad_accum_steps: 1                 # NO accum: grad accum doesn't feed centering/Sinkhorn, so a real batch is required.
  epochs: 10                          # halved (was 20). Aggressive LR + shorter warmup means we know fast if it works.
  weight_decay: 0.04
  weight_decay_end: 0.4
  base_lr: 3.0e-3                     # effective = 3e-3 * sqrt(16/1024) = 3.75e-4 (was 3e-4 -> 3.75e-5, 13x too low
                                      # = an LR-isolation experiment, NOT a training config; the model couldn't learn).
  warmup_epochs: 1.0                  # 0.3 was too short for the 10x-higher LR; 1 epoch avoids an early explosion.
  min_lr: 1.0e-06
  clip_grad: 3.0
  freeze_last_layer_epochs: 1
  scaling_rule: sqrt_wrt_1024
  patch_embed_lr_mult: 0.2
  layerwise_decay: 1.0
  adamw_beta1: 0.9
  adamw_beta2: 0.999

crops:
  global_crops_scale: [0.32, 1.0]
  local_crops_number: 4               # 2 global + 4 local (down from 8: Test 1's full-volume locals are
                                      # redundant + memory-heavy; centering only needs the globals anyway)
  local_crops_scale: [0.05, 0.32]
  global_crops_size: 224              # unused in fmri_mode (img_size comes from fmri_img_size) but must be present for the schema
  local_crops_size: 96                # same — accepted for API parity with DataAugmentationDINO

dino:
  loss_weight: 1.0
  head_n_prototypes: 4096
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048
  koleo_loss_weight: 0                # OFF: KoLeo hurts on near-identical registered brains (A/B this session:
                                      # random 78.5% -> 75.3% with koleo) and risks log(0)->NaN on homogeneous data.

ibot:
  loss_weight: 1.0
  mask_sample_probability: 0.5
  mask_ratio_min_max: [0.1, 0.5]
  separate_head: false
  head_n_prototypes: 4096
  head_bottleneck_dim: 256
  head_nlayers: 3
  head_hidden_dim: 2048

evaluation:
  eval_period_iterations: 0           # no in-loop evaluation; we evaluate the saved checkpoint separately
